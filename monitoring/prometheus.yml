global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets:
          - "10.10.0.10:9100"
          - "10.10.0.21:9100"
          - "10.10.0.22:9100"
          - "10.10.0.31:9100"
          - "10.10.0.41:9100"
        labels:
          env: lab

  - job_name: cadvisor
    static_configs:
      - targets:
          - "10.10.0.10:8080"
          - "10.10.0.21:8080"
          - "10.10.0.22:8080"
          - "10.10.0.31:8080"
          - "10.10.0.41:8080"

  - job_name: traefik
    static_configs:
      - targets: ["10.10.0.10:8082"]

  - job_name: registry
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.0.10:5001"]
